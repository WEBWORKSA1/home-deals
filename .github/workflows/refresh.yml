name: Refresh data and rebuild site

# Keeps Home.Deals self-updating: pulls fresh public data four times a day,
# rebuilds the static pages, runs the pre-publish checks and commits only
# when something actually changed. GitHub Pages (deploy from branch: main,
# folder: / root) then republishes on its own.

on:
  schedule:
    - cron: "23 5,11,17,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "content/**"
      - "assets/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh data, rebuild, check and publish
        run: |
          git config user.name "home-deals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          make_site() {
            python3 scripts/update_data.py
            python3 scripts/build.py
            python3 scripts/check.py
          }

          publish() {
            git add -A
            if git diff --cached --quiet -- . ':(exclude)data/_status.json'; then
              echo "No content changes."
              return 0
            fi
            git commit -q -m "chore(data): automatic refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          }

          # A failed check stops here, so a broken build is never published.
          make_site

          if ! publish; then
            echo "Push was rejected because main moved. Rebuilding on top of the latest main."
            git fetch origin main
            git reset --hard origin/main
            make_site
            publish
          fi
